services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${DBSCANNER_OTLP_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${DBSCANNER_OTLP_BIND_ADDRESS:-127.0.0.1}:4318:4318"
      - "127.0.0.1:9464:9464"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./scan-compatibility-alerts.yaml:/etc/prometheus/rules/scan-compatibility-alerts.yaml:ro
      - dbscanner-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scan-compatibility-dashboard.json:/var/lib/grafana/dashboards/scan-compatibility-dashboard.json:ro
      - dbscanner-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  dbscanner-prometheus-data:
  dbscanner-grafana-data:
